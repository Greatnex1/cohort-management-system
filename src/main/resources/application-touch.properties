spring.jpa.database=POSTGRESQL
spring.jpa.hibernate.ddl-auto=create
spring.datasource.url=${DB_URI}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver



keycloak.principal_attribute=preferred_username
keycloak.realm=${KEYCLOAK_REALM}
#keycloak.realm=${KEYCLOAK_REALM:identity}
keycloak.enabled=true


spring.security.oauth2.resourceserver.opaquetoken.client-id=${CLIENT_ID}
spring.security.oauth2.resourceserver.opaquetoken.client-secret=${CLIENT_SECRET}
spring.security.oauth2.resourceserver.opaquetoken.introspection-uri=${KEYCLOAK_SERVER_URL}/realms/${keycloak.realm}/protocol/openid-connect/token/introspect
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_SERVER_URL}/realms/${keycloak.realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_SERVER_URL}/realms/${keycloak.realm}/protocol/openid-connect/certs


